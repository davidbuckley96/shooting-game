<script>
const TAU = Math.PI*2;
// ---------- cena compartilhada (mesma composição nas 4 propostas) ----------
const SCENE = {
  castle: {x:195,y:235},
  towers: [{x:78,y:425},{x:312,y:398}],
  king:   {x:105,y:645},
  target: {x:300,y:610},
  goblins:[{x:268,y:556},{x:305,y:585},{x:338,y:562},{x:290,y:640},{x:332,y:648},
           {x:360,y:610},{x:258,y:700},{x:300,y:720},{x:345,y:735},{x:365,y:688},{x:245,y:762}],
  brute:  {x:330,y:520},
  trees:  [{x:26,y:120,s:1.1},{x:352,y:130,s:.9},{x:40,y:790,s:1},{x:355,y:815,s:1.15},{x:322,y:78,s:.75},{x:60,y:320,s:.8}],
  rocks:  [{x:52,y:528},{x:352,y:462}],
  coins:  [{x:152,y:700},{x:172,y:718},{x:138,y:726}],
};
function hud(ctx, style){ // HUD comum, com pequenas variações de estilo
  ctx.save();
  const pills=[['🪙','245'],['🌙','Noite 3'],['🏰','87%']];
  let x=28;
  ctx.textBaseline='middle';
  for(const [ic,tx] of pills){
    ctx.font='bold 15px system-ui';
    const w=ctx.measureText(ic+' '+tx).width+26;
    ctx.fillStyle=style.pillBg;
    ctx.beginPath();ctx.roundRect(x,16,w,32,16);ctx.fill();
    if(style.pillStroke){ctx.strokeStyle=style.pillStroke;ctx.lineWidth=2.5;ctx.stroke();}
    ctx.fillStyle=style.pillFg;
    ctx.fillText(ic+' '+tx,x+13,33);
    x+=w+9;
  }
  ctx.restore();
}
function sh(ctx,x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();}

// ============================================================
// PROPOSTA A — "Cartoon Chunky": contornos grossos, cores vivas
// ============================================================
(function(){
  const ctx=document.getElementById('propA').getContext('2d');
  ctx.scale(2,2);
  const OUT='#33241d', LW=3.5;
  const o=(fn,fill)=>{ctx.beginPath();fn();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=LW;ctx.lineJoin='round';ctx.stroke();};
  // chão vibrante
  ctx.fillStyle='#8bc34a';ctx.fillRect(0,0,390,844);
  ctx.fillStyle='#7cb342';
  for(const [px,py,pr] of [[60,220,50],[330,300,64],[130,500,46],[240,800,70],[40,660,40],[300,180,36]]){
    ctx.beginPath();ctx.ellipse(px,py,pr,pr*.55,0,0,TAU);ctx.fill();
  }
  // caminho de terra
  ctx.strokeStyle='#d7b56d';ctx.lineWidth=34;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(195,300);ctx.quadraticCurveTo(180,480,260,640);ctx.quadraticCurveTo(320,760,390,780);ctx.stroke();
  ctx.strokeStyle='#c9a55c';ctx.lineWidth=26;ctx.stroke();
  // árvores
  for(const t of SCENE.trees){
    sh(ctx,t.x,t.y+16*t.s,16*t.s,6*t.s,'rgba(40,60,20,.3)');
    o(()=>{ctx.rect(t.x-4*t.s,t.y-2*t.s,8*t.s,16*t.s);},'#8d5a2b');
    o(()=>{ctx.arc(t.x,t.y-20*t.s,17*t.s,0,TAU);ctx.arc(t.x-12*t.s,t.y-8*t.s,11*t.s,0,TAU);ctx.arc(t.x+12*t.s,t.y-9*t.s,11*t.s,0,TAU);},'#4caf50');

  }
  for(const r of SCENE.rocks){
    o(()=>{ctx.moveTo(r.x-14,r.y+6);ctx.lineTo(r.x-8,r.y-9);ctx.lineTo(r.x+5,r.y-11);ctx.lineTo(r.x+14,r.y);ctx.lineTo(r.x+10,r.y+7);ctx.closePath();},'#b0b8bf');
  }
  // castelo: creme + telhados azuis
  const c=SCENE.castle;
  sh(ctx,c.x,c.y+58,72,18,'rgba(40,60,20,.35)');
  for(const dx of [-52,52]){
    o(()=>{ctx.rect(c.x+dx-16,c.y-52,32,88);},'#f2e3c2');
    o(()=>{ctx.moveTo(c.x+dx-22,c.y-52);ctx.lineTo(c.x+dx,c.y-88);ctx.lineTo(c.x+dx+22,c.y-52);ctx.closePath();},'#3f7fd6');
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(c.x+dx,c.y-30,5,0,TAU);ctx.fill();
    ctx.strokeStyle=OUT;ctx.lineWidth=2.5;ctx.stroke();
  }
  o(()=>{ctx.rect(c.x-56,c.y-30,112,66);},'#f7ead0');
  for(let i=-4;i<=4;i+=2) o(()=>{ctx.rect(c.x+i*12-6,c.y-42,12,12);},'#f2e3c2');
  o(()=>{ctx.moveTo(c.x-30,c.y-30);ctx.lineTo(c.x,c.y-60);ctx.lineTo(c.x+30,c.y-30);ctx.closePath();},'#3f7fd6');
  o(()=>{ctx.arc(c.x,c.y+14,15,Math.PI,0);ctx.rect(c.x-15,c.y+14,30,22);},'#7a4a22');
  ctx.strokeStyle='#5d3a1a';ctx.lineWidth=2;
  for(const dx of [-7,0,7]){ctx.beginPath();ctx.moveTo(c.x+dx,c.y+8);ctx.lineTo(c.x+dx,c.y+34);ctx.stroke();}
  ctx.strokeStyle=OUT;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(c.x,c.y-60);ctx.lineTo(c.x,c.y-84);ctx.stroke();
  o(()=>{ctx.moveTo(c.x,c.y-84);ctx.lineTo(c.x+24,c.y-76);ctx.lineTo(c.x,c.y-68);ctx.closePath();},'#ef4136');
  // torres
  for(const t of SCENE.towers){
    sh(ctx,t.x,t.y+34,26,9,'rgba(40,60,20,.35)');
    o(()=>{ctx.moveTo(t.x-18,t.y+30);ctx.lineTo(t.x-13,t.y-38);ctx.lineTo(t.x+13,t.y-38);ctx.lineTo(t.x+18,t.y+30);ctx.closePath();},'#f2e3c2');
    o(()=>{ctx.rect(t.x-19,t.y-46,38,10);},'#e8d5ac');
    o(()=>{ctx.moveTo(t.x-20,t.y-46);ctx.lineTo(t.x,t.y-74);ctx.lineTo(t.x+20,t.y-46);ctx.closePath();},'#3f7fd6');
    ctx.fillStyle='#5d3a1a';ctx.beginPath();ctx.roundRect(t.x-3,t.y-24,6,16,3);ctx.fill();
    o(()=>{ctx.arc(t.x,t.y-52,6,0,TAU);},'#7fd44e'); // arqueiro espiando
  }
  // moedas
  for(const m of SCENE.coins){
    o(()=>{ctx.arc(m.x,m.y,8,0,TAU);},'#ffd23e');
    ctx.strokeStyle='#c8901a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(m.x,m.y,4.5,0,TAU);ctx.stroke();
  }
  // goblins: verdes, orelhudos, com porrete
  for(const g of SCENE.goblins){
    sh(ctx,g.x,g.y+12,11,4.5,'rgba(40,60,20,.35)');
    o(()=>{ctx.moveTo(g.x-11,g.y-4);ctx.lineTo(g.x-20,g.y-13);ctx.lineTo(g.x-8,g.y-11);ctx.closePath();
           ctx.moveTo(g.x+11,g.y-4);ctx.lineTo(g.x+20,g.y-13);ctx.lineTo(g.x+8,g.y-11);ctx.closePath();},'#69a84f');
    o(()=>{ctx.arc(g.x,g.y,12,0,TAU);},'#7fc25e');
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(g.x-4,g.y-2,3.4,0,TAU);ctx.arc(g.x+4,g.y-2,3.4,0,TAU);ctx.fill();
    ctx.fillStyle='#d32f2f';ctx.beginPath();ctx.arc(g.x-4.6,g.y-2,1.6,0,TAU);ctx.arc(g.x+3.4,g.y-2,1.6,0,TAU);ctx.fill();
    ctx.strokeStyle=OUT;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(g.x-7,g.y-6.5);ctx.lineTo(g.x-2,g.y-4.5);ctx.moveTo(g.x+7,g.y-6.5);ctx.lineTo(g.x+2,g.y-4.5);ctx.stroke();
    o(()=>{ctx.roundRect(g.x-19,g.y-1,7,13,3);},'#8d5a2b'); // porrete
  }
  // bruto
  const b=SCENE.brute;
  sh(ctx,b.x,b.y+16,16,6,'rgba(40,60,20,.35)');
  o(()=>{ctx.arc(b.x,b.y,17,0,TAU);},'#c1554a');
  o(()=>{ctx.moveTo(b.x-15,b.y-9);ctx.lineTo(b.x-24,b.y-22);ctx.lineTo(b.x-8,b.y-15);ctx.closePath();
         ctx.moveTo(b.x+15,b.y-9);ctx.lineTo(b.x+24,b.y-22);ctx.lineTo(b.x+8,b.y-15);ctx.closePath();},'#f2e3c2');
  ctx.fillStyle='#ffdd55';ctx.beginPath();ctx.arc(b.x-6,b.y-4,3.6,0,TAU);ctx.arc(b.x+6,b.y-4,3.6,0,TAU);ctx.fill();
  // rei a cavalo com ARCO (ataque à distância)
  const k=SCENE.king;
  sh(ctx,k.x,k.y+20,26,9,'rgba(40,60,20,.4)');
  ctx.strokeStyle=OUT;ctx.lineWidth=4.5;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(k.x-15,k.y+8);ctx.lineTo(k.x-18,k.y+20);ctx.moveTo(k.x-6,k.y+9);ctx.lineTo(k.x-4,k.y+20);
  ctx.moveTo(k.x+7,k.y+9);ctx.lineTo(k.x+9,k.y+20);ctx.moveTo(k.x+14,k.y+8);ctx.lineTo(k.x+18,k.y+20);ctx.stroke();
  o(()=>{ctx.ellipse(k.x,k.y+2,23,12,0,0,TAU);},'#a9713d');
  o(()=>{ctx.moveTo(k.x+16,k.y-2);ctx.lineTo(k.x+28,k.y-18);ctx.lineTo(k.x+35,k.y-15);ctx.lineTo(k.x+24,k.y+3);ctx.closePath();},'#a9713d');
  o(()=>{ctx.ellipse(k.x+33,k.y-18,8.5,6,-.4,0,TAU);},'#a9713d');
  ctx.fillStyle='#6e4527';ctx.beginPath();ctx.ellipse(k.x+24,k.y-13,4.5,8,.5,0,TAU);ctx.fill();
  // capa vermelha esvoaçante
  o(()=>{ctx.moveTo(k.x-4,k.y-26);ctx.quadraticCurveTo(k.x-26,k.y-18,k.x-22,k.y+2);ctx.quadraticCurveTo(k.x-10,k.y-4,k.x-2,k.y-10);ctx.closePath();},'#ef4136');
  o(()=>{ctx.roundRect(k.x-8,k.y-28,16,20,5);},'#3f7fd6'); // gibão azul
  o(()=>{ctx.arc(k.x,k.y-36,8.5,0,TAU);},'#ffd9b0');
  o(()=>{ctx.moveTo(k.x-8,k.y-42);ctx.lineTo(k.x-8,k.y-52);ctx.lineTo(k.x-3,k.y-45);ctx.lineTo(k.x,k.y-53);
        ctx.lineTo(k.x+3,k.y-45);ctx.lineTo(k.x+8,k.y-52);ctx.lineTo(k.x+8,k.y-42);ctx.closePath();},'#ffd23e');
  // arco dourado + flecha
  ctx.strokeStyle='#c8901a';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(k.x+16,k.y-24,14,-1.2,1.2);ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(k.x+20,k.y-37);ctx.lineTo(k.x+8,k.y-24);ctx.lineTo(k.x+20,k.y-11);ctx.stroke();
  // flecha voando + rastro
  const tg=SCENE.target;
  ctx.setLineDash([2,7]);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(k.x+30,k.y-26);ctx.quadraticCurveTo((k.x+tg.x)/2+20,k.y-90,tg.x-24,tg.y-32);ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle=OUT;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(tg.x-34,tg.y-46);ctx.lineTo(tg.x-18,tg.y-26);ctx.stroke();
  o(()=>{ctx.moveTo(tg.x-18,tg.y-26);ctx.lineTo(tg.x-27,tg.y-28);ctx.lineTo(tg.x-20,tg.y-35);ctx.closePath();},'#ffd23e');
  // impacto!
  ctx.fillStyle='#fff';
  for(let i=0;i<8;i++){const a=i/8*TAU;
    ctx.beginPath();ctx.ellipse(tg.x+Math.cos(a)*16,tg.y-8+Math.sin(a)*16,4,2,a,0,TAU);ctx.fill();}
  ctx.font='900 22px system-ui';ctx.fillStyle='#ffd23e';ctx.strokeStyle=OUT;ctx.lineWidth=4;
  ctx.strokeText('12',tg.x+8,tg.y-38);ctx.fillText('12',tg.x+8,tg.y-38);
  hud(ctx,{pillBg:'rgba(41,29,20,.85)',pillFg:'#ffe9b0',pillStroke:'#33241d'});
})();
</script>
<script>
// ============================================================
// PROPOSTA B — "Flat Suave": sem contornos, pastel, luz lateral
// ============================================================
(function(){
  const ctx=document.getElementById('propB').getContext('2d');
  ctx.scale(2,2);
  const SHA='rgba(64,102,56,.30)'; // sombras longas p/ baixo-esquerda
  // chão pastel com faixas diagonais sutis
  ctx.fillStyle='#a8d178';ctx.fillRect(0,0,390,844);
  ctx.fillStyle='rgba(255,255,255,.07)';
  for(let i=-3;i<9;i++){ctx.beginPath();ctx.moveTo(i*90,0);ctx.lineTo(i*90+140,844);ctx.lineTo(i*90+190,844);ctx.lineTo(i*90+50,0);ctx.fill();}
  ctx.fillStyle='#98c46a';
  for(const [px,py,pr] of [[70,240,54],[320,320,66],[140,520,48],[250,790,72],[50,680,42]]){
    ctx.beginPath();ctx.ellipse(px,py,pr,pr*.5,0,0,TAU);ctx.fill();
  }
  const path=new Path2D();path.moveTo(195,300);path.quadraticCurveTo(180,480,260,640);path.quadraticCurveTo(320,760,390,780);
  ctx.strokeStyle='#e8d5a3';ctx.lineWidth=30;ctx.lineCap='round';ctx.stroke(path);
  // árvores redondinhas
  for(const t of SCENE.trees){
    sh(ctx,t.x-6*t.s,t.y+14*t.s,17*t.s,6*t.s,SHA);
    ctx.fillStyle='#b58a55';ctx.fillRect(t.x-3.5*t.s,t.y-4*t.s,7*t.s,16*t.s);
    ctx.fillStyle='#6fb063';ctx.beginPath();ctx.arc(t.x,t.y-20*t.s,18*t.s,0,TAU);ctx.fill();
    ctx.fillStyle='#84c476';ctx.beginPath();ctx.arc(t.x-6*t.s,t.y-26*t.s,10*t.s,0,TAU);ctx.fill();
  }
  for(const r of SCENE.rocks){
    sh(ctx,r.x-5,r.y+7,15,5,SHA);
    ctx.fillStyle='#c3c8cc';ctx.beginPath();ctx.moveTo(r.x-13,r.y+6);ctx.lineTo(r.x-7,r.y-9);ctx.lineTo(r.x+6,r.y-10);ctx.lineTo(r.x+13,r.y+1);ctx.lineTo(r.x+9,r.y+7);ctx.closePath();ctx.fill();
    ctx.fillStyle='#dde1e4';ctx.beginPath();ctx.moveTo(r.x-7,r.y-9);ctx.lineTo(r.x+6,r.y-10);ctx.lineTo(r.x+3,r.y-2);ctx.closePath();ctx.fill();
  }
  // castelo branco-creme, telhados coral
  const c=SCENE.castle;
  sh(ctx,c.x-14,c.y+62,76,18,SHA);
  for(const dx of [-52,52]){
    ctx.fillStyle='#faf3e3';ctx.fillRect(c.x+dx-16,c.y-52,32,88);
    ctx.fillStyle='#efe4cc';ctx.fillRect(c.x+dx+4,c.y-52,12,88); // lado sombreado
    ctx.fillStyle='#e8846b';ctx.beginPath();ctx.moveTo(c.x+dx-21,c.y-52);ctx.lineTo(c.x+dx,c.y-86);ctx.lineTo(c.x+dx+21,c.y-52);ctx.closePath();ctx.fill();
    ctx.fillStyle='#d96f57';ctx.beginPath();ctx.moveTo(c.x+dx,c.y-86);ctx.lineTo(c.x+dx+21,c.y-52);ctx.lineTo(c.x+dx+7,c.y-52);ctx.closePath();ctx.fill();
  }
  ctx.fillStyle='#faf3e3';ctx.fillRect(c.x-56,c.y-30,112,66);
  ctx.fillStyle='#efe4cc';ctx.fillRect(c.x+22,c.y-30,34,66);
  ctx.fillStyle='#faf3e3';for(let i=-4;i<=4;i+=2)ctx.fillRect(c.x+i*12-6,c.y-41,12,11);
  ctx.fillStyle='#e8846b';ctx.beginPath();ctx.moveTo(c.x-30,c.y-30);ctx.lineTo(c.x,c.y-58);ctx.lineTo(c.x+30,c.y-30);ctx.closePath();ctx.fill();
  ctx.fillStyle='#8a6844';ctx.beginPath();ctx.arc(c.x,c.y+14,14,Math.PI,0);ctx.rect(c.x-14,c.y+14,28,22);ctx.fill();
  ctx.strokeStyle='#b58a55';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(c.x,c.y-58);ctx.lineTo(c.x,c.y-80);ctx.stroke();
  ctx.fillStyle='#f2b8408';
  ctx.fillStyle='#f2b840';ctx.beginPath();ctx.moveTo(c.x,c.y-80);ctx.lineTo(c.x+22,c.y-73);ctx.lineTo(c.x,c.y-66);ctx.closePath();ctx.fill();
  // torres
  for(const t of SCENE.towers){
    sh(ctx,t.x-8,t.y+34,25,8,SHA);
    ctx.fillStyle='#faf3e3';ctx.beginPath();ctx.moveTo(t.x-17,t.y+30);ctx.lineTo(t.x-12,t.y-38);ctx.lineTo(t.x+12,t.y-38);ctx.lineTo(t.x+17,t.y+30);ctx.closePath();ctx.fill();
    ctx.fillStyle='#efe4cc';ctx.beginPath();ctx.moveTo(t.x+2,t.y-38);ctx.lineTo(t.x+12,t.y-38);ctx.lineTo(t.x+17,t.y+30);ctx.lineTo(t.x+5,t.y+30);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e8846b';ctx.beginPath();ctx.moveTo(t.x-19,t.y-44);ctx.lineTo(t.x,t.y-70);ctx.lineTo(t.x+19,t.y-44);ctx.closePath();ctx.fill();
    ctx.fillStyle='#7a5c3a';ctx.fillRect(t.x-2.5,t.y-24,5,15);
  }
  // moedas
  for(const m of SCENE.coins){
    sh(ctx,m.x-3,m.y+8,8,3,SHA);
    ctx.fillStyle='#f2b840';ctx.beginPath();ctx.arc(m.x,m.y,8,0,TAU);ctx.fill();
    ctx.fillStyle='#ffd670';ctx.beginPath();ctx.arc(m.x-2,m.y-2,4.5,0,TAU);ctx.fill();
  }
  // goblins gotinha
  for(const g of SCENE.goblins){
    sh(ctx,g.x-4,g.y+11,11,4,SHA);
    ctx.fillStyle='#7cb865';
    ctx.beginPath();ctx.moveTo(g.x-11,g.y+8);ctx.quadraticCurveTo(g.x-13,g.y-14,g.x,g.y-13);ctx.quadraticCurveTo(g.x+13,g.y-14,g.x+11,g.y+8);ctx.closePath();ctx.fill();
    ctx.fillStyle='#8fcc78';ctx.beginPath();ctx.arc(g.x-4,g.y-6,5,0,TAU);ctx.fill();
    ctx.fillStyle='#6aa355';
    ctx.beginPath();ctx.moveTo(g.x-10,g.y-8);ctx.lineTo(g.x-17,g.y-16);ctx.lineTo(g.x-6,g.y-13);ctx.closePath();
    ctx.moveTo(g.x+10,g.y-8);ctx.lineTo(g.x+17,g.y-16);ctx.lineTo(g.x+6,g.y-13);ctx.closePath();ctx.fill();
    ctx.fillStyle='#2f3e28';ctx.beginPath();ctx.arc(g.x-4,g.y-3,2,0,TAU);ctx.arc(g.x+4,g.y-3,2,0,TAU);ctx.fill();
  }
  const b=SCENE.brute;
  sh(ctx,b.x-6,b.y+15,16,6,SHA);
  ctx.fillStyle='#cf7a63';ctx.beginPath();ctx.moveTo(b.x-16,b.y+12);ctx.quadraticCurveTo(b.x-19,b.y-19,b.x,b.y-18);ctx.quadraticCurveTo(b.x+19,b.y-19,b.x+16,b.y+12);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e39b86';ctx.beginPath();ctx.arc(b.x-6,b.y-8,7,0,TAU);ctx.fill();
  ctx.fillStyle='#f5ead3';
  ctx.beginPath();ctx.moveTo(b.x-14,b.y-13);ctx.lineTo(b.x-21,b.y-24);ctx.lineTo(b.x-7,b.y-18);ctx.closePath();
  ctx.moveTo(b.x+14,b.y-13);ctx.lineTo(b.x+21,b.y-24);ctx.lineTo(b.x+7,b.y-18);ctx.closePath();ctx.fill();
  ctx.fillStyle='#3a2a24';ctx.beginPath();ctx.arc(b.x-5,b.y-5,2.4,0,TAU);ctx.arc(b.x+5,b.y-5,2.4,0,TAU);ctx.fill();
  // rei
  const k=SCENE.king;
