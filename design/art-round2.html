<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Arte rodada 2</title>
<style>body{margin:0;background:#1a1a1a;display:flex;flex-direction:column;gap:24px;align-items:center;padding:24px}canvas{width:390px;height:844px;border-radius:12px}</style>
</head><body>
<canvas id="propE" width="780" height="1688"></canvas>
<script>
const TAU=Math.PI*2;
const ctx=document.getElementById('propE').getContext('2d');
ctx.scale(2,2);

// ---------- helpers de cor e volume ----------
function hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function css(r,g,b,a=1){return `rgba(${r|0},${g|0},${b|0},${a})`;}
function shade(h,f){const [r,g,b]=hx(h);return f>=0?css(r+(255-r)*f,g+(255-g)*f,b+(255-b)*f):css(r*(1+f),g*(1+f),b*(1+f));}
// sombra de contato macia
function contact(x,y,rx,ry,a=0.32){
  const g=ctx.createRadialGradient(x,y,0,x,y,rx);
  g.addColorStop(0,`rgba(24,48,16,${a})`);g.addColorStop(1,'rgba(24,48,16,0)');
  ctx.save();ctx.translate(x,y);ctx.scale(1,ry/rx);ctx.translate(-x,-y);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rx,0,TAU);ctx.fill();ctx.restore();
}
// esfera com luz do topo-esquerda + especular
function sphere(x,y,r,base,spec=true){
  const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r*1.05);
  g.addColorStop(0,shade(base,.38));g.addColorStop(.55,base);g.addColorStop(1,shade(base,-.38));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  if(spec){ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(x-r*.35,y-r*.45,r*.28,r*.17,-.5,0,TAU);ctx.fill();}
}
// cilindro vertical (paredes)
function cyl(x,y,w,h,base,ry=0){
  const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
  g.addColorStop(0,shade(base,-.28));g.addColorStop(.28,shade(base,.3));g.addColorStop(.62,base);g.addColorStop(1,shade(base,-.42));
  ctx.fillStyle=g;
  ctx.beginPath();ctx.rect(x-w/2,y-h,w,h);ctx.fill();
  if(ry>0){ctx.fillStyle=shade(base,.42);ctx.beginPath();ctx.ellipse(x,y-h,w/2,ry,0,0,TAU);ctx.fill();}
}
// cone (telhados) com brilho
function cone(x,y,w,h,base){
  const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
  g.addColorStop(0,shade(base,-.3));g.addColorStop(.3,shade(base,.34));g.addColorStop(.6,base);g.addColorStop(1,shade(base,-.44));
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.quadraticCurveTo(x,y+6,x+w/2,y);ctx.lineTo(x,y-h);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.28)';
  ctx.beginPath();ctx.moveTo(x-w*.17,y-h*.28);ctx.quadraticCurveTo(x-w*.05,y-h*.62,x-w*.02,y-h*.88);
  ctx.quadraticCurveTo(x+w*.06,y-h*.55,x+w*.06,y-h*.26);ctx.closePath();ctx.fill();
}

// ---------- cena (mesma composição das rodadas anteriores) ----------
const SCENE={
  castle:{x:195,y:235},
  towers:[{x:78,y:425},{x:312,y:398}],
  king:{x:105,y:645},
  target:{x:300,y:610},
  goblins:[{x:268,y:556},{x:305,y:585},{x:338,y:562},{x:290,y:640},{x:332,y:648},
           {x:360,y:610},{x:258,y:700},{x:300,y:720},{x:345,y:735},{x:365,y:688},{x:245,y:762}],
  brute:{x:330,y:520},
  trees:[{x:26,y:120,s:1.1},{x:352,y:130,s:.9},{x:40,y:790,s:1},{x:355,y:815,s:1.15},{x:322,y:78,s:.75},{x:60,y:320,s:.8}],
  rocks:[{x:52,y:528},{x:352,y:462}],
  coins:[{x:152,y:700},{x:172,y:718},{x:138,y:726}],
};

// ---------- chão rico ----------
(function ground(){
  const g=ctx.createRadialGradient(195,380,80,195,480,620);
  g.addColorStop(0,'#7ec84f');g.addColorStop(.7,'#66b23e');g.addColorStop(1,'#4e9330');
  ctx.fillStyle=g;ctx.fillRect(0,0,390,844);
  // faixas de grama "aparada"
  ctx.globalAlpha=.10;
  for(let i=-2;i<10;i++){
    ctx.fillStyle=i%2?'#ffffff':'#1e5410';
    ctx.beginPath();ctx.moveTo(i*74,0);ctx.lineTo(i*74+90,844);ctx.lineTo(i*74+127,844);ctx.lineTo(i*74+37,0);ctx.fill();
  }
  ctx.globalAlpha=1;
  // manchas orgânicas
  const spots=[[70,240,50],[320,320,62],[140,520,46],[250,790,68],[50,680,40],[300,180,34],[180,90,40]];
  for(const [px,py,pr] of spots){
    const sg=ctx.createRadialGradient(px,py,0,px,py,pr);
    sg.addColorStop(0,'rgba(30,84,16,.16)');sg.addColorStop(1,'rgba(30,84,16,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.ellipse(px,py,pr,pr*.55,0,0,TAU);ctx.fill();
  }
  // caminho de terra com borda clara
  const P=new Path2D();P.moveTo(195,300);P.quadraticCurveTo(180,480,260,640);P.quadraticCurveTo(320,760,390,780);
  ctx.strokeStyle='#e9d9a8';ctx.lineWidth=38;ctx.lineCap='round';ctx.stroke(P);
  ctx.strokeStyle='#d4b878';ctx.lineWidth=30;ctx.stroke(P);
  ctx.strokeStyle='#c4a566';ctx.lineWidth=22;ctx.stroke(P);
  // pedrinhas no caminho
  ctx.fillStyle='rgba(255,246,220,.5)';
  for(const [sx,sy] of [[196,340],[188,420],[205,500],[232,570],[262,640],[300,706],[338,752]]){
    ctx.beginPath();ctx.ellipse(sx,sy,4,2.5,.4,0,TAU);ctx.fill();
  }
  // tufos de grama
  ctx.strokeStyle='#3f8526';ctx.lineWidth=2;ctx.lineCap='round';
  for(const [tx,ty] of [[90,170],[280,240],[60,430],[160,590],[230,470],[110,760],[330,830],[30,590],[370,300]]){
    for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(tx+i*4,ty);ctx.quadraticCurveTo(tx+i*5,ty-7,tx+i*7,ty-10);ctx.stroke();}
  }
})();

// ---------- árvores volumétricas ----------
for(const t of SCENE.trees){
  contact(t.x,t.y+14*t.s,22*t.s,8*t.s,.38);
  cyl(t.x,t.y+12*t.s,9*t.s,18*t.s,'#8a5a2e');
  sphere(t.x+9*t.s,t.y-14*t.s,12*t.s,'#3e9032',false);
  sphere(t.x-9*t.s,t.y-13*t.s,13*t.s,'#46a038',false);
  sphere(t.x,t.y-24*t.s,15*t.s,'#52ae42');
}
for(const r of SCENE.rocks){
  contact(r.x,r.y+7,17,6,.35);
  sphere(r.x,r.y,12,'#a8b0b8');
  sphere(r.x+8,r.y+3,7,'#98a0a8',false);
}

// ---------- castelo 3D cartoon ----------
(function castle(){
  const c=SCENE.castle;
  contact(c.x,c.y+52,95,26,.42);
  // torres traseiras
  for(const dx of [-52,52]){
    cyl(c.x+dx,c.y+38,36,92,'#e8ddc4',7);
    // ameias das torres
    for(let i=-1;i<=1;i++){ctx.fillStyle=shade('#e8ddc4',i===0?.28:.06);ctx.fillRect(c.x+dx+i*12-5,c.y-62,10,10);}
    cone(c.x+dx,c.y-58,52,46,'#4a7fd4');
    // base dourada do telhado
    ctx.fillStyle='#d9a93f';ctx.fillRect(c.x+dx-21,c.y-60,42,5);
  }
  // corpo principal
  cyl(c.x,c.y+38,116,70,'#f2e8cf');
  // fileira de pedras (textura sutil)
  ctx.globalAlpha=.15;ctx.strokeStyle='#8a7a58';ctx.lineWidth=1.5;
  for(let ly=0;ly<4;ly++){ctx.beginPath();ctx.moveTo(c.x-56,c.y+22-ly*16);ctx.lineTo(c.x+56,c.y+22-ly*16);ctx.stroke();
    for(let lx=0;lx<6;lx++){ctx.beginPath();const bx=c.x-50+lx*20+(ly%2?10:0);ctx.moveTo(bx,c.y+22-ly*16);ctx.lineTo(bx,c.y+6-ly*16);ctx.stroke();}}
  ctx.globalAlpha=1;
  // ameias do corpo
  for(let i=-4;i<=4;i+=2){ctx.fillStyle=shade('#f2e8cf',i<0?.2:-.08);ctx.fillRect(c.x+i*13-6,c.y-42,12,12);}
  // telhado central
  cone(c.x,c.y-28,68,52,'#4a7fd4');
  ctx.fillStyle='#d9a93f';ctx.fillRect(c.x-28,c.y-31,56,5);
  // porta com arco e AO
  ctx.fillStyle='rgba(40,24,8,.25)';ctx.beginPath();ctx.arc(c.x,c.y+16,18,Math.PI,0);ctx.rect(c.x-18,c.y+16,36,24);ctx.fill();
  const dg=ctx.createLinearGradient(c.x-14,0,c.x+14,0);
  dg.addColorStop(0,'#8a5a2e');dg.addColorStop(.5,'#a8743e');dg.addColorStop(1,'#7a4a24');
  ctx.fillStyle=dg;ctx.beginPath();ctx.arc(c.x,c.y+16,14,Math.PI,0);ctx.rect(c.x-14,c.y+16,28,22);ctx.fill();
  ctx.strokeStyle='rgba(60,32,10,.6)';ctx.lineWidth=1.5;
  for(const ddx of [-7,0,7]){ctx.beginPath();ctx.moveTo(c.x+ddx,c.y+6);ctx.lineTo(c.x+ddx,c.y+38);ctx.stroke();}
  // janelas
  for(const dx of [-52,52]){ctx.fillStyle='#2e3f66';ctx.beginPath();ctx.arc(c.x+dx,c.y-20,5.5,Math.PI,0);ctx.rect(c.x+dx-5.5,c.y-20,11,14);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(c.x+dx-5.5,c.y-20,4,14);}
  // bandeira
  ctx.strokeStyle='#6b4a22';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(c.x,c.y-80);ctx.lineTo(c.x,c.y-108);ctx.stroke();
  const fg=ctx.createLinearGradient(c.x,c.y-108,c.x+26,c.y-92);
  fg.addColorStop(0,'#ff6242');fg.addColorStop(1,'#d43a20');
  ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(c.x,c.y-108);ctx.quadraticCurveTo(c.x+18,c.y-104,c.x+26,c.y-99);ctx.quadraticCurveTo(c.x+16,c.y-96,c.x,c.y-90);ctx.closePath();ctx.fill();
  sphere(c.x,c.y-110,3.5,'#f2c14e');
})();

// ---------- torres de arqueiro ----------
for(const t of SCENE.towers){
  contact(t.x,t.y+32,30,10,.4);
  cyl(t.x,t.y+30,34,68,'#e8ddc4',6);
  ctx.globalAlpha=.14;ctx.strokeStyle='#8a7a58';ctx.lineWidth=1.5;
  for(let ly=0;ly<3;ly++){ctx.beginPath();ctx.moveTo(t.x-16,t.y+16-ly*17);ctx.lineTo(t.x+16,t.y+16-ly*17);ctx.stroke();}
  ctx.globalAlpha=1;
  ctx.fillStyle='#d9a93f';ctx.fillRect(t.x-18,t.y-42,36,5);
  cone(t.x,t.y-40,46,42,'#4a7fd4');
  // seteira
  ctx.fillStyle='rgba(40,24,8,.55)';ctx.beginPath();ctx.arc(t.x,t.y-18,3.5,Math.PI,0);ctx.rect(t.x-3.5,t.y-18,7,12);ctx.fill();
}

// ---------- moedas 3D ----------
for(const m of SCENE.coins){
  contact(m.x,m.y+7,9,3.5,.3);
  sphere(m.x,m.y,8,'#f2c14e');
  ctx.strokeStyle='rgba(160,110,20,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(m.x,m.y,4.6,0,TAU);ctx.stroke();
}

// ---------- goblins com volume ----------
for(const g of SCENE.goblins){
  contact(g.x,g.y+12,13,5,.4);
  // orelhas
  for(const s of [-1,1]){
    const eg=ctx.createLinearGradient(g.x+s*8,g.y-14,g.x+s*20,g.y-8);
    eg.addColorStop(0,'#6dbb4e');eg.addColorStop(1,'#3f8526');
    ctx.fillStyle=eg;ctx.beginPath();ctx.moveTo(g.x+s*8,g.y-8);ctx.quadraticCurveTo(g.x+s*20,g.y-16,g.x+s*19,g.y-6);ctx.quadraticCurveTo(g.x+s*13,g.y-2,g.x+s*8,g.y-4);ctx.closePath();ctx.fill();
  }
  sphere(g.x,g.y,12.5,'#6dbb4e');
  // olhos brabos
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(g.x-4.5,g.y-2.5,3.6,4,0,0,TAU);ctx.ellipse(g.x+4.5,g.y-2.5,3.6,4,0,0,TAU);ctx.fill();
  ctx.fillStyle='#c62818';
  ctx.beginPath();ctx.arc(g.x-3.6,g.y-1.8,1.8,0,TAU);ctx.arc(g.x+5.4,g.y-1.8,1.8,0,TAU);ctx.fill();
  ctx.strokeStyle='#2e5218';ctx.lineWidth=2.2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(g.x-8,g.y-7.5);ctx.lineTo(g.x-1.5,g.y-5);ctx.moveTo(g.x+8,g.y-7.5);ctx.lineTo(g.x+1.5,g.y-5);ctx.stroke();
  // dentinhos
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(g.x-3,g.y+6);ctx.lineTo(g.x-1.5,g.y+3.6);ctx.lineTo(g.x,g.y+6);ctx.closePath();
  ctx.moveTo(g.x+1,g.y+6);ctx.lineTo(g.x+2.5,g.y+3.6);ctx.lineTo(g.x+4,g.y+6);ctx.closePath();ctx.fill();
  // porrete
  ctx.save();ctx.translate(g.x-15,g.y+4);ctx.rotate(-.5);
  cyl(0,8,4,14,'#8a5a2e');sphere(0,-7,5.5,'#a8743e',false);ctx.restore();
}

// ---------- bruto ----------
(function brute(){
  const b=SCENE.brute;
  contact(b.x,b.y+17,19,7,.42);
  for(const s of [-1,1]){
    const hg=ctx.createLinearGradient(b.x+s*10,b.y-16,b.x+s*24,b.y-26);
    hg.addColorStop(0,'#f2e8cf');hg.addColorStop(1,'#c9b98e');
    ctx.fillStyle=hg;ctx.beginPath();ctx.moveTo(b.x+s*10,b.y-12);ctx.quadraticCurveTo(b.x+s*24,b.y-28,b.x+s*22,b.y-12);ctx.quadraticCurveTo(b.x+s*16,b.y-6,b.x+s*10,b.y-8);ctx.closePath();ctx.fill();
  }
  sphere(b.x,b.y,18,'#c8543e');
  ctx.fillStyle='#f8d848';
  ctx.beginPath();ctx.arc(b.x-6.5,b.y-4,3.6,0,TAU);ctx.arc(b.x+6.5,b.y-4,3.6,0,TAU);ctx.fill();
  ctx.fillStyle='#5a1408';
  ctx.beginPath();ctx.arc(b.x-6,b.y-3.4,1.7,0,TAU);ctx.arc(b.x+7,b.y-3.4,1.7,0,TAU);ctx.fill();
  ctx.strokeStyle='#701e10';ctx.lineWidth=2.6;
  ctx.beginPath();ctx.moveTo(b.x-11,b.y-10);ctx.lineTo(b.x-3,b.y-7);ctx.moveTo(b.x+11,b.y-10);ctx.lineTo(b.x+3,b.y-7);ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(b.x-5,b.y+8);ctx.lineTo(b.x-2.6,b.y+4);ctx.lineTo(b.x-.4,b.y+8);ctx.closePath();
  ctx.moveTo(b.x+1,b.y+8);ctx.lineTo(b.x+3.4,b.y+4);ctx.lineTo(b.x+5.6,b.y+8);ctx.closePath();ctx.fill();
})();

// ---------- rei arqueiro a cavalo ----------
(function king(){
  const k=SCENE.king;
  contact(k.x,k.y+21,30,10,.45);
  // pernas
  ctx.strokeStyle='#7a4e26';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(k.x-15,k.y+8);ctx.lineTo(k.x-18,k.y+21);ctx.moveTo(k.x-6,k.y+10);ctx.lineTo(k.x-5,k.y+21);
  ctx.moveTo(k.x+8,k.y+10);ctx.lineTo(k.x+10,k.y+21);ctx.moveTo(k.x+15,k.y+8);ctx.lineTo(k.x+19,k.y+21);ctx.stroke();
  ctx.fillStyle='#4a3018'; // cascos
  for(const [hx2,hy2] of [[-18,21],[-5,21],[10,21],[19,21]]){ctx.beginPath();ctx.ellipse(k.x+hx2,k.y+hy2+1,3.4,2.4,0,0,TAU);ctx.fill();}
  // corpo do cavalo com gradiente
  const bg=ctx.createRadialGradient(k.x-6,k.y-6,4,k.x,k.y+2,30);
  bg.addColorStop(0,'#c08a52');bg.addColorStop(.6,'#a8743e');bg.addColorStop(1,'#7a4e26');
  ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(k.x,k.y+2,25,13,0,0,TAU);ctx.fill();
  // pescoço/cabeça
  ctx.beginPath();ctx.moveTo(k.x+17,k.y-2);ctx.quadraticCurveTo(k.x+26,k.y-16,k.x+31,k.y-19);ctx.lineTo(k.x+38,k.y-15);ctx.quadraticCurveTo(k.x+32,k.y-6,k.x+26,k.y+4);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(k.x+36,k.y-18,9,6.5,-.35,0,TAU);ctx.fill();
  ctx.fillStyle='#5a3416';ctx.beginPath();ctx.ellipse(k.x+26,k.y-13,4.5,8.5,.5,0,TAU);ctx.fill(); // crina
  ctx.fillStyle='#d8b088';ctx.beginPath();ctx.ellipse(k.x+41,k.y-16.5,4.5,3.4,-.35,0,TAU);ctx.fill(); // focinho claro
  ctx.fillStyle='#2b2018';ctx.beginPath();ctx.arc(k.x+42.5,k.y-17,1.1,0,TAU);ctx.fill(); // narina
  ctx.fillStyle='#2b2018';ctx.beginPath();ctx.arc(k.x+35,k.y-20.5,1.8,0,TAU);ctx.fill(); // olho
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(k.x+35.6,k.y-21.1,.7,0,TAU);ctx.fill();
  ctx.fillStyle='#8a5a2e';ctx.beginPath();ctx.moveTo(k.x+31,k.y-23);ctx.lineTo(k.x+33,k.y-29);ctx.lineTo(k.x+36,k.y-23);ctx.closePath();ctx.fill(); // orelha
  // cauda
  ctx.strokeStyle='#5a3416';ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(k.x-23,k.y-3);ctx.quadraticCurveTo(k.x-32,k.y+5,k.x-27,k.y+16);ctx.stroke();
  // sela vermelha
  ctx.fillStyle='#c62818';ctx.beginPath();ctx.ellipse(k.x-1,k.y-8,10,5,0,0,TAU);ctx.fill();
  // capa esvoaçante com gradiente
  const cg=ctx.createLinearGradient(k.x-26,k.y-24,k.x-4,k.y-4);
  cg.addColorStop(0,'#a81e10');cg.addColorStop(1,'#e04530');
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.moveTo(k.x-3,k.y-30);ctx.quadraticCurveTo(k.x-28,k.y-22,k.x-24,k.y+2);ctx.quadraticCurveTo(k.x-12,k.y-4,k.x-2,k.y-12);ctx.closePath();ctx.fill();
  // torso azul com brilho
  const tg2=ctx.createLinearGradient(k.x-8,0,k.x+8,0);
  tg2.addColorStop(0,'#6a9be0');tg2.addColorStop(.5,'#4a7fd4');tg2.addColorStop(1,'#33589e');
  ctx.fillStyle=tg2;ctx.beginPath();ctx.roundRect(k.x-8.5,k.y-31,17,22,6);ctx.fill();
  // cinto dourado
  ctx.fillStyle='#d9a93f';ctx.fillRect(k.x-8.5,k.y-14,17,4);
  // cabeça (proporção chibi)
  sphere(k.x,k.y-41,11.5,'#f5cf9e');
  // bochechas
  ctx.fillStyle='rgba(230,120,90,.30)';
  ctx.beginPath();ctx.arc(k.x-5.5,k.y-38,2.6,0,TAU);ctx.arc(k.x+5.5,k.y-38,2.6,0,TAU);ctx.fill();
  // olhos
  ctx.fillStyle='#2b2018';
  ctx.beginPath();ctx.arc(k.x-3.4,k.y-42,1.7,0,TAU);ctx.arc(k.x+3.4,k.y-42,1.7,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(k.x-2.9,k.y-42.6,.7,0,TAU);ctx.arc(k.x+3.9,k.y-42.6,.7,0,TAU);ctx.fill();
  // barbicha real
  ctx.fillStyle='#e8e0d0';
  ctx.beginPath();ctx.moveTo(k.x-3,k.y-33);ctx.quadraticCurveTo(k.x,k.y-27,k.x+3,k.y-33);ctx.closePath();ctx.fill();
  // coroa dourada com gradiente e joia
  const kg=ctx.createLinearGradient(k.x-8,k.y-56,k.x+8,k.y-46);
  kg.addColorStop(0,'#ffe082');kg.addColorStop(.5,'#f2c14e');kg.addColorStop(1,'#c8901a');
  ctx.fillStyle=kg;
  ctx.beginPath();ctx.moveTo(k.x-9,k.y-50);ctx.lineTo(k.x-9,k.y-61);ctx.lineTo(k.x-3,k.y-53.5);ctx.lineTo(k.x,k.y-62);
  ctx.lineTo(k.x+3,k.y-53.5);ctx.lineTo(k.x+9,k.y-61);ctx.lineTo(k.x+9,k.y-50);ctx.closePath();ctx.fill();
  sphere(k.x,k.y-49,2.4,'#c62818');
  // arco dourado recurvo + flecha em riste
  ctx.strokeStyle='#c8901a';ctx.lineWidth=4.5;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(k.x+19,k.y-26,16,-1.25,1.25);ctx.stroke();
  ctx.strokeStyle='#ffe082';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.arc(k.x+19,k.y-26,16,-1.15,1.15);ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(k.x+24,k.y-41);ctx.lineTo(k.x+10,k.y-26);ctx.lineTo(k.x+24,k.y-11);ctx.stroke();
  // braço puxando
  ctx.strokeStyle='#f5cf9e';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(k.x+2,k.y-24);ctx.lineTo(k.x+12,k.y-26);ctx.stroke();
})();

// ---------- flecha, rastro e impacto ----------
(function shot(){
  const k=SCENE.king,tg=SCENE.target;
  // rastro em arco com pontos que somem
  for(let i=0;i<10;i++){
    const f=i/10;
    const px=k.x+34+(tg.x-26-k.x-34)*f, py=(k.y-28)+(tg.y-32-k.y+28)*f-Math.sin(f*Math.PI)*55;
    ctx.fillStyle=`rgba(255,255,255,${.15+f*.55})`;
    ctx.beginPath();ctx.arc(px,py,1.6+f*1.6,0,TAU);ctx.fill();
  }
  // flecha
  ctx.save();ctx.translate(tg.x-24,tg.y-30);ctx.rotate(.9);
  ctx.strokeStyle='#8a5a2e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(8,0);ctx.stroke();
  ctx.fillStyle='#e8e8e8';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(2,-3.5);ctx.lineTo(2,3.5);ctx.closePath();ctx.fill();
  ctx.fillStyle='#c62818';ctx.beginPath();ctx.moveTo(-14,-2.8);ctx.lineTo(-9,0);ctx.lineTo(-14,2.8);ctx.closePath();ctx.fill();
  ctx.restore();
  // impacto estrelado
  ctx.fillStyle='#fff';
  for(let i=0;i<8;i++){
    const a=i/8*TAU, r1=8, r2=i%2?20:15;
    ctx.beginPath();
    ctx.moveTo(tg.x+Math.cos(a-.18)*r1,tg.y-8+Math.sin(a-.18)*r1);
    ctx.lineTo(tg.x+Math.cos(a)*r2,tg.y-8+Math.sin(a)*r2);
    ctx.lineTo(tg.x+Math.cos(a+.18)*r1,tg.y-8+Math.sin(a+.18)*r1);
    ctx.closePath();ctx.fill();
  }
  const ig=ctx.createRadialGradient(tg.x,tg.y-8,0,tg.x,tg.y-8,10);
  ig.addColorStop(0,'#fff');ig.addColorStop(1,'#ffd23e');
  ctx.fillStyle=ig;ctx.beginPath();ctx.arc(tg.x,tg.y-8,9,0,TAU);ctx.fill();
  // número de dano com peso
  ctx.font='900 24px system-ui';ctx.textAlign='center';
  ctx.strokeStyle='#5a2808';ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.strokeText('12',tg.x+16,tg.y-36);
  const dg=ctx.createLinearGradient(0,tg.y-52,0,tg.y-32);
  dg.addColorStop(0,'#ffe082');dg.addColorStop(1,'#f2a63f');
  ctx.fillStyle=dg;ctx.fillText('12',tg.x+16,tg.y-36);
  ctx.textAlign='left';
})();

// ---------- vinheta de luz ----------
(function vignette(){
  const v=ctx.createRadialGradient(195,400,220,195,430,620);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(16,40,8,.22)');
  ctx.fillStyle=v;ctx.fillRect(0,0,390,844);
})();

// ---------- HUD ----------
(function hud(){
  const pills=[['🪙','245'],['🌙','Noite 3'],['🏰','87%']];
  let x=24;ctx.textBaseline='middle';
  for(const [ic,tx] of pills){
    ctx.font='bold 15px system-ui';
    const w=ctx.measureText(ic+' '+tx).width+28;
    const pg=ctx.createLinearGradient(0,16,0,50);
    pg.addColorStop(0,'rgba(52,38,22,.92)');pg.addColorStop(1,'rgba(30,20,10,.92)');
    ctx.fillStyle=pg;ctx.beginPath();ctx.roundRect(x,16,w,34,17);ctx.fill();
    ctx.strokeStyle='#d9a93f';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#ffe9b0';ctx.fillText(ic+' '+tx,x+14,34);
    x+=w+9;
  }
})();
